services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: ./backend/.env

  discord-bot:
    build: ./discord-bot
    env_file: ./discord-bot/.env
    restart: unless-stopped
